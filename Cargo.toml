[workspace]
resolver = "3"
members = ["crates/music", "crates/chat", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-stream = "0.3"
axum = "0.8"
bytes = "1"
fastrand = "2"
flacenc = "0.5"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
