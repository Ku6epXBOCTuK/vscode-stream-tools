[workspace]
resolver = "3"
members = ["crates/music", "crates/chat", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-stream = "0.3"
axum = "0.8"
bytes = "1"
fastrand = "2"
flacenc = "0.5"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
twitch_api = { version = "0.8", features = ["helix", "eventsub", "client", "reqwest", "twitch_oauth2"] }
twitch_oauth2 = { version = "0.17", features = ["client", "reqwest"] }
url = "2"
